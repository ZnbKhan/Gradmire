name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

# `next build` is deliberately not run here. generateStaticParams calls
# getAllHubPaths(), which needs DATABASE_URL, so a build in CI would fail for
# want of a database rather than for a real defect. The build is verified
# locally against a real connection string instead.
